name: Verify pilot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-pilot.lock
      - run: pip install -r requirements-pilot.lock
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_pilot.py
      - run: python scripts/analyze_pilot.py
      - run: git diff --exit-code -- results/pilot/summary.json results/pilot/per-example.csv results/pilot/report.md
