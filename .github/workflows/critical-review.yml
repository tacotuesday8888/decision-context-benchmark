name: Critical evidence review
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3 numpy==2.4.4 scipy==1.17.1
      - run: python -m unittest discover -s tests/critical_review -v
      - run: python -m scripts.critical_review.verify --output /tmp/dcb-compact-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: compact-review
          path: /tmp/dcb-compact-review.json
      - run: git diff --check
