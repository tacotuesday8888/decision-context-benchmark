name: Source discovery offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/source_discovery/verify.py
      - run: python -m unittest discover -s tests/source_discovery -v
      - run: python scripts/source_discovery/catalog.py
      - run: git diff --exit-code -- results/source-discovery/catalog.json results/source-discovery/catalog.csv
