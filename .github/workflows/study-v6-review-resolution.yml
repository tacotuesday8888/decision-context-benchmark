name: Study v6 review resolution checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/study_v6/verify_resolution.py
      - run: python -m unittest discover -s tests/study_v6_resolution -v
