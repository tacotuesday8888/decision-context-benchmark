name: Verify expanded execution offline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-expanded-v2-data.txt
      - run: pip install -r requirements-expanded-v2-data.txt
      - run: python -m unittest discover -s tests/expanded_execution -v
      - run: python scripts/expanded_execution/verify.py
