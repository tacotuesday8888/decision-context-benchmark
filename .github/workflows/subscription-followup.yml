name: Subscription follow-up safeguards
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-followup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3 numpy==2.4.4 scipy==1.17.1
      - run: python -m unittest discover -s tests/subscription_followup -v
      - run: python -m scripts.subscription_followup.data_checks
      - run: git diff --check
